<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Life Log</title>
    
    <script>
      // 請將單引號中的網址，換成您剛剛組裝好的 Drive 圖片連結
      var ICON_URL = 'https://drive.google.com/thumbnail?id=1OKZ6v1Ia-8jINelQ9uim40Jjw438KBgd&sz=w256';
    </script>

    <script>
      document.write('<link rel="apple-touch-icon" href="' + ICON_URL + '">');
    </script>
    
    <script>
      document.write('<link rel="icon" type="image/png" href="' + ICON_URL + '">');
      document.write('<link rel="shortcut icon" type="image/png" href="' + ICON_URL + '">');
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
      /* --- V9.0 全新 UI 風格設定 --- */
      
      body {
        font-family: 'Noto Sans TC', sans-serif;
        /* ✨ 質感深色背景：讓白色卡片浮起來 */
        background-color: #525f7f; 
        margin: 0;
        padding: 0;
        color: #333;
        padding-bottom: 100px; /* 留給底部導覽列更多空間 */
      }

      .container {
        max-width: 600px;
        margin: 0 auto;
        min-height: 100vh;
        padding: 20px;
        /* 移除原本的白色背景，改為透明，讓它融入深色底 */
        background: transparent; 
      }

      /* --- 底部導覽列 (集中置中 + 膠囊樣式) --- */
      .nav-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        background: rgba(255, 255, 255, 0.95); /* 稍微透明的毛玻璃感 */
        backdrop-filter: blur(10px);
        display: flex;
        justify-content: center; /* ⭐ 關鍵：讓圖示置中 */
        padding: 15px 0;
        box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
        z-index: 1000;
        gap: 30px; /* 按鈕之間的距離 */
      }

      .nav-item {
        text-align: center;
        color: #8898aa; /* 未選中時是質感灰 */
        cursor: pointer;
        /* 定義按鈕大小與形狀 */
        width: 110px; 
        padding: 8px 0;
        border-radius: 30px; /* 圓潤膠囊狀 */
        transition: all 0.3s ease; /* 滑順動畫 */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      /* ⭐ 選中狀態：深色背景 + 上浮效果 */
      .nav-item.active {
        color: #5e72e4; /* 亮眼藍字 */
        background-color: #f4f7fe; /* 淺藍底色 */
        font-weight: bold;
        transform: translateY(-2px); /* 微微浮起 */
        box-shadow: 0 4px 10px rgba(94, 114, 228, 0.15); /* 柔和陰影 */
      }
      
      .nav-icon { font-size: 20px; margin-bottom: 2px; }
      .nav-text { font-size: 13px; }

      /* --- 頁面內容區塊 --- */
      .page-content {
        display: none;
        animation: fadeIn 0.4s ease;
      }
      .page-content.active { display: block; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

      /* --- 寫日記頁面 (獨立白卡設計) --- */
      #page-write {
        background: white;
        padding: 30px;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      }

      /* --- 表單元件 --- */
      h2 { color: #525f7f; margin-top: 0; text-align: center; font-weight: 700; margin-bottom: 25px; }
      label { display: block; margin-bottom: 8px; font-weight: 500; color: #555; font-size: 0.95em; }
      textarea, input[type="text"], input[type="date"] {
        width: 100%; padding: 14px; margin-bottom: 20px;
        border: 2px solid #e9ecef; border-radius: 10px; /* 加粗邊框 */
        font-size: 16px; box-sizing: border-box;
        transition: border-color 0.3s;
        background: #f8f9fa;
      }
      textarea:focus, input:focus { border-color: #5e72e4; outline: none; background: white; }
      textarea { height: 150px; resize: none; }
      
      /* 按鈕美化 */
      button { transition: transform 0.1s; }
      button:active { transform: scale(0.98); }
      
      button.primary-btn {
        width: 100%; padding: 16px; background: linear-gradient(135deg, #5e72e4 0%, #825ee4 100%);
        color: white; border: none; border-radius: 10px;
        font-size: 18px; font-weight: bold; cursor: pointer;
        box-shadow: 0 4px 15px rgba(94, 114, 228, 0.3);
      }
      button.secondary-btn {
        width: 100%; padding: 14px; background-color: #2dce89;
        color: white; border: none; border-radius: 10px;
        font-size: 16px; cursor: pointer; margin-top: 10px;
        box-shadow: 0 4px 15px rgba(45, 206, 137, 0.3);
      }
      .loading { display: none; text-align: center; margin-top: 15px; color: #8898aa; }

      /* --- 回憶牆樣式 --- */
      .diary-card {
        background: white; 
        border: none; /* 移除邊框，改用陰影 */
        border-radius: 16px; padding: 25px; margin-bottom: 30px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1); /* 更深的立體陰影 */
        position: relative;
      }
      .diary-img {
        width: 100%; border-radius: 12px; margin-top: 15px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      }
      
      /* 搜尋區塊美化 */
      .search-container {
        background: white; padding: 20px; 
        border-radius: 16px; margin-bottom: 25px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      }

      .diary-date-header {
        font-size: 1.3em; font-weight: 700; color: #5e72e4;
        border-bottom: 2px solid #f4f5f7; padding-bottom: 15px; margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      
      <div id="page-write" class="page-content active">
        <h2>📝 記錄生活</h2>
        <form id="diaryForm" onsubmit="handleFormSubmit(this)">
          
          <label>日期 (若要補寫請選擇)</label>
          <input type="date" name="customDate">

          <label>發生了什麼事？</label>
          <textarea name="content" placeholder="寫下今天的快樂碎片..." required></textarea>

          <label>標籤</label>
          <input type="text" name="tags" placeholder="#心情 #靈感">

          <label>照片 (可多選)</label>
          <input type="file" name="myFile" accept="image/*" multiple>

          <hr style="margin: 25px 0; border: 0; border-top: 1px dashed #e9ecef;">
          
          <button type="submit" id="submitBtn" class="primary-btn">儲存日記</button>
                 
          <button type="button" id="importBtn" onclick="handleImport()" class="secondary-btn">
             📂 匯入今日同步資料夾檔案
          </button>

          <div id="status" class="loading">正在寫入回憶...</div>
        </form>
      </div>

      <div id="page-read" class="page-content">
        
        <div class="search-container">
          <div style="display:flex; gap:10px; margin-bottom:15px;">
            <input type="text" id="searchKeyword" placeholder="搜尋關鍵字..." style="margin:0; flex:2;">
            <input type="date" id="searchDate" style="margin:0; flex:1;">
          </div>
          <button onclick="performSearch()" class="primary-btn" style="padding:12px; font-size:16px; background: #5e72e4;">🔍 搜尋日記</button>
          <button onclick="resetSearch()" style="width:100%; margin-top:10px; background:none; border:none; color:#8898aa; cursor:pointer; font-size:14px;">↺ 清除搜尋 / 顯示最近</button>
        </div>

        <div id="diaryContainer">
          <div style="text-align:center; padding: 40px; color:rgba(255,255,255,0.7);">正在喚醒回憶...</div>
        </div>
      </div>

    </div>

    <div class="nav-bar">
      <div class="nav-item active" onclick="switchTab('write')">
        <span class="nav-icon">✏️</span>
        <span class="nav-text">寫日記</span>
      </div>
      <div class="nav-item" onclick="switchTab('read')">
        <span class="nav-icon">📖</span>
        <span class="nav-text">看回憶</span>
      </div>
    </div>

    <div id="editModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:2000; backdrop-filter: blur(5px);">
      <div style="background:white; margin: 10% auto; width: 85%; max-width:500px; padding:30px; border-radius:16px; box-shadow:0 10px 40px rgba(0,0,0,0.3);">
        <h3 style="margin-top:0; color:#5e72e4; text-align:center;">✏️ 編輯日記</h3>
        <input type="hidden" id="editId">
        <label>內容</label>
        <textarea id="editContent" style="height:150px;"></textarea>
        <label>標籤</label>
        <input type="text" id="editTags">
        <label>更換/補上照片 (選填)</label>
        <input type="file" id="editFile" accept="image/*" style="padding:10px; margin-bottom:15px; border:1px solid #ddd; background:white;">
        <div style="display:flex; gap:15px; margin-top:15px;">
          <button onclick="closeEditModal()" style="flex:1; padding:12px; border:1px solid #ddd; background:white; border-radius:10px; color:#555;">取消</button>
          <button onclick="saveEdit()" style="flex:1; padding:12px; background:#5e72e4; color:white; border:none; border-radius:10px; font-weight:bold;">儲存修改</button>
        </div>
      </div>
    </div>

    <script>
      // --- V9.1 修正版腳本 (修復語法錯誤與引號問題) ---

      // 1. 頁籤切換
      function switchTab(tabName) {
        // 移除所有 nav-item 的 active
        var navItems = document.querySelectorAll('.nav-item');
        for (var i = 0; i < navItems.length; i++) {
          navItems[i].classList.remove('active');
        }
        
        // 設定當前點擊的為 active
        event.currentTarget.classList.add('active');
        
        // 切換頁面顯示
        var pages = document.querySelectorAll('.page-content');
        for (var j = 0; j < pages.length; j++) {
          pages[j].classList.remove('active');
        }
        document.getElementById('page-' + tabName).classList.add('active');
        
        // 捲動到頂部
        window.scrollTo(0,0);

        // 如果是切換到「看回憶」，就載入資料
        if (tabName === 'read') {
            loadDiaries(); 
        }
      }

      // 2. 寫日記提交 (V9.2 修正版：修復多檔讀取時的變數鎖定問題)
      function handleFormSubmit(form) {
        event.preventDefault(); // 阻止表單預設跳轉
        
        var btn = document.getElementById("submitBtn");
        var status = document.getElementById("status");
        
        btn.disabled = true; 
        btn.innerText = "打包上傳中..."; 
        status.style.display = "block";

        var fileInput = form.myFile;
        var files = fileInput.files;
        var filePromises = [];

        // 使用 let 確保變數鎖定在當下迴圈，不會跑掉
        for (let i = 0; i < files.length; i++) {
          // ⭐ 關鍵修正：先把當前的檔案抓出來存成區域變數
          let currentFile = files[i];
          
          filePromises.push(new Promise(function(resolve, reject) {
            var reader = new FileReader();
            
            reader.onload = function(e) {
              // 這裡改用 currentFile，絕對不會抓錯人
              resolve({ 
                  name: currentFile.name, 
                  type: currentFile.type, 
                  data: e.target.result 
              });
            };
            
            reader.onerror = reject;
            reader.readAsDataURL(currentFile);
          }));
        }

        Promise.all(filePromises).then(function(processedFiles) {
          var payload = {
            customDate: form.customDate.value,
            content: form.content.value,
            tags: form.tags.value,
            files: processedFiles
          };

          google.script.run
            .withSuccessHandler(function(response) {
              alert(response.message);
              document.getElementById("diaryForm").reset();
              btn.disabled = false; 
              btn.innerText = "儲存日記"; 
              status.style.display = "none";
              // 自動跳轉到看回憶
              document.querySelectorAll('.nav-item')[1].click(); 
            })
            .withFailureHandler(function(e) {
              alert("❌ 錯誤：" + e.message);
              btn.disabled = false; 
              btn.innerText = "儲存日記"; 
              status.style.display = "none";
            })
            .saveDiaryV8(payload); 
        }).catch(function(err) {
          alert("❌ 檔案讀取失敗：" + err);
          btn.disabled = false;
          btn.innerText = "儲存日記";
        });
      }

      // 3. 匯入功能
      function handleImport() {
        if(!confirm("確定要匯入？")) return;
        var btn = document.getElementById("importBtn");
        var status = document.getElementById("status");
        btn.disabled = true; btn.innerText = "掃描中..."; status.style.display = "block";
        
        google.script.run.withSuccessHandler(function(r) {
           alert(r.message);
           btn.disabled = false; btn.innerText = "📂 匯入今日同步資料夾檔案"; status.style.display = "none";
           document.querySelectorAll('.nav-item')[1].click();
        }).importFromSyncFolder();
      }

      // 4. 讀取與搜尋
      function loadDiaries() {
        document.getElementById("diaryContainer").innerHTML = '<div style="text-align:center; padding:40px; color:rgba(255,255,255,0.7);">正在喚醒回憶...</div>';
        google.script.run.withSuccessHandler(renderDiaries).getRecentDiaries();
      }

      function performSearch() {
        var keyword = document.getElementById("searchKeyword").value;
        var date = document.getElementById("searchDate").value;
        document.getElementById("diaryContainer").innerHTML = '<div style="text-align:center; padding:40px; color:rgba(255,255,255,0.7);">🔍 搜尋中...</div>';
        google.script.run.withSuccessHandler(renderDiaries).searchLogs(keyword, date);
      }

      function resetSearch() {
        document.getElementById("searchKeyword").value = "";
        document.getElementById("searchDate").value = "";
        loadDiaries();
      }

      // 5. 渲染列表 (V11.0 修正排序：同一天內由舊到新)
      function renderDiaries(diaries) {
        var container = document.getElementById("diaryContainer");
        container.innerHTML = "";
        
        if (!diaries || diaries.length === 0) {
          container.innerHTML = '<div style="text-align:center; color:rgba(255,255,255,0.7); padding:40px;">找不到相關日記 🐢</div>';
          return;
        }

        var groupedDiaries = {};
        diaries.forEach(function(d) {
          if (!groupedDiaries[d.dateStr]) groupedDiaries[d.dateStr] = [];
          groupedDiaries[d.dateStr].push(d);
        });

        // 日期排序：由新到舊 (昨天在今天的下面)
        var sortedDates = Object.keys(groupedDiaries).sort(function(a, b) {
          return new Date(b) - new Date(a);
        });

        sortedDates.forEach(function(date) {
          var dailyEntries = groupedDiaries[date];
          
          // ⭐ 關鍵修正：同一天內的日記，按時間「由早到晚」排序 (09:00 -> 15:00)
          dailyEntries.sort(function(a, b) {
            return a.time.localeCompare(b.time);
          });

          var entriesHtml = dailyEntries.map(function(entry) {
            
            var imgHtml = "";
            if (entry.image && entry.image.trim() !== "" && entry.image.indexOf("drive.google.com") !== -1) {
              var fileId = "";
              var match = entry.image.match(/\/d\/([a-zA-Z0-9_-]+)/);
              if (match) fileId = match[1];
              else { 
                  match = entry.image.match(/id=([a-zA-Z0-9_-]+)/); 
                  if(match) fileId = match[1]; 
              }
              if (fileId) {
                var thumbUrl = "https://drive.google.com/thumbnail?id=" + fileId + "&sz=w1200";
                imgHtml = `<img src="${thumbUrl}" class="diary-img" loading="lazy" onerror="this.style.display='none'">`;
              }
            }

            return `
              <div class="diary-entry-item" style="border-bottom:1px dashed #eee; padding-bottom:20px; margin-bottom:20px; position:relative;">
                <div style="position:absolute; top:0; right:0; display:flex; gap:8px;">
                  <button onclick="openEditModal('${entry.id}')" style="background:none; border:none; cursor:pointer; font-size:1.2em; padding:5px; opacity:0.6;" title="編輯">✏️</button>
                  <button onclick="deleteDiary('${entry.id}')" style="background:none; border:none; cursor:pointer; font-size:1.2em; padding:5px; opacity:0.6;" title="刪除">🗑️</button>
                </div>
                <div style="font-size:0.85em; color:#8898aa; margin-bottom:8px;">
                   ⏰ ${entry.time}
                </div>
                <div id="content-${entry.id}" style="font-size:1.1em; line-height:1.7; color:#333; white-space: pre-wrap; margin-right:30px;">${entry.content}</div>
                ${imgHtml}
                <div id="tags-${entry.id}" style="color:#5e72e4; font-size:0.9em; margin-top:12px; font-weight:500;">${entry.tags}</div>
              </div>`;
          }).join("");

          container.insertAdjacentHTML('beforeend', 
            '<div class="diary-card"><div class="diary-date-header">📅 ' + date + '</div>' + entriesHtml + '</div>'
          );
        });
      }

      // 6. 編輯功能 (V11.0 支援圖片)
      function openEditModal(id) {
        var content = document.getElementById("content-" + id).innerText;
        var tags = document.getElementById("tags-" + id).innerText;
        document.getElementById("editId").value = id;
        document.getElementById("editContent").value = content;
        document.getElementById("editTags").value = tags;
        document.getElementById("editFile").value = ""; // 清空上次選的檔案
        document.getElementById("editModal").style.display = "block";
      }
      
      // 關閉 Modal (維持不變，如果沒寫可以補上)
      function closeEditModal() {
        document.getElementById("editModal").style.display = "none";
      }

      function saveEdit() {
        var id = document.getElementById("editId").value;
        var content = document.getElementById("editContent").value;
        var tags = document.getElementById("editTags").value;
        var fileInput = document.getElementById("editFile");
        var file = fileInput.files[0];
        
        if(!confirm("確定要儲存修改嗎？")) return;
        
        var saveBtn = event.target; 
        var originalText = saveBtn.innerText;
        saveBtn.innerText = "上傳更新中..."; 
        saveBtn.disabled = true;

        // 定義發送資料到後端的函式
        function sendToServer(filePayload) {
            google.script.run.withSuccessHandler(function(r) {
              alert(r.message);
              closeEditModal();
              
              var k = document.getElementById("searchKeyword").value;
              var d = document.getElementById("searchDate").value;
              if (k || d) { performSearch(); } else { loadDiaries(); }
              
              saveBtn.innerText = originalText; 
              saveBtn.disabled = false;
            }).updateLog(id, content, tags, filePayload);
        }

        // 如果有選照片，先讀取再傳；沒選就傳 null
        if (file) {
            var reader = new FileReader();
            reader.onload = function(e) {
                sendToServer({
                    name: file.name,
                    type: file.type,
                    data: e.target.result
                });
            };
            reader.readAsDataURL(file);
        } else {
            sendToServer(null);
        }
      }

      // 7. 刪除功能
      function deleteDiary(id) {
        if(!confirm("⚠️ 確定要刪除這篇日記嗎？\n(注意：僅會刪除文字紀錄，雲端硬碟中的照片原檔保留)")) return;

        // 顯示載入中畫面
        document.getElementById("diaryContainer").innerHTML = '<div style="text-align:center; padding:40px; color:rgba(255,255,255,0.7);">正在刪除回憶...</div>';

        google.script.run
          .withSuccessHandler(function(r) {
            alert(r.message);
            // 刪除成功後，檢查是否有套用搜尋條件，決定要重新搜尋還是單純載入
            var k = document.getElementById("searchKeyword").value;
            var d = document.getElementById("searchDate").value;
            if (k || d) { performSearch(); } else { loadDiaries(); }
          })
          .withFailureHandler(function(e) {
            alert("❌ 刪除發生錯誤: " + e.message);
            loadDiaries(); // 發生錯誤也重新載入列表
          })
          .deleteLog(id);
      }
    </script>
